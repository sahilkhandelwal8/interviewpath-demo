[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zamp-provider-comparison"
version = "0.1.0"
description = "Bounded Firecrawl versus Exa research-provider comparison harness"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.0",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
provider-comparison = "provider_comparison.cli:main"
outreach-workspace = "provider_comparison.web:main"

[tool.setuptools.package-data]
provider_comparison = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
